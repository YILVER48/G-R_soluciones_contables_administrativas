<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G&R Soluciones — Ver Página Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      padding: 1.5rem;
    }

    .wrapper {
      max-width: 700px;
      width: 100%;
      text-align: center;
    }

    /* La imagen del flyer — clicable */
    .flyer-link {
      display: block;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
      transition: transform .3s ease, box-shadow .3s ease;
      position: relative;
    }
    .flyer-link:hover {
      transform: translateY(-4px);
      box-shadow: 0 28px 72px rgba(200,155,60,.3);
    }
    .flyer-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Overlay "clic aquí" que aparece al pasar el mouse */
    .flyer-link__overlay {
      position: absolute;
      inset: 0;
      background: rgba(200,155,60,.12);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity .3s ease;
      border-radius: 16px;
    }
    .flyer-link:hover .flyer-link__overlay { opacity: 1; }
    .flyer-link__overlay span {
      background: rgba(200,155,60,.95);
      color: #111;
      font-size: 1rem;
      font-weight: 700;
      padding: .75rem 2rem;
      border-radius: 50px;
      letter-spacing: .05em;
    }

    /* Texto debajo */
    .hint {
      margin-top: 1.25rem;
      color: rgba(255,255,255,.5);
      font-size: .82rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .hint::before, .hint::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,.1);
    }

    .url-bar {
      margin-top: .75rem;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(200,155,60,.25);
      border-radius: 50px;
      padding: .6rem 1.25rem;
      color: #C89B3C;
      font-size: .82rem;
      letter-spacing: .03em;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- IMAGEN CLICABLE — reemplazar src con el nombre real del flyer -->
    <a class="flyer-link"
       href="https://yilver48.github.io/G-R_soluciones_contables_administrativas/"
       target="_blank"
       rel="noopener noreferrer"
       title="Visitar página web de G&R Soluciones">
      <img
        src="flyer.png"
        alt="G&R Soluciones Contables y Administrativas — Haz clic para visitar nuestra página web"
      />
      <div class="flyer-link__overlay">
        <span>🌐 Visitar Página Web</span>
      </div>
    </a>

    <p class="hint">Haz clic en la imagen para visitar nuestro sitio web</p>
    <div class="url-bar">
      🔗 yilver48.github.io/G-R_soluciones_contables_administrativas/
    </div>

  </div>
</body>
</html>
